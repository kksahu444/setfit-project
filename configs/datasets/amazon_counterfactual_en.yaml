dataset:
  name: SetFit/amazon_counterfactual_en
  text_column: text
  label_column: label
  label_names:
    - NON-COUNTERFACTUAL
    - COUNTERFACTUAL

data_loader:
  k_per_class: 8
  seed: 42
  test_size: 0.2

train:
  base_model_name: sentence-transformers/paraphrase-mpnet-base-v2
  batch_size: 16
  epochs: 1
  lr_max_iter: 1000
  mode: baseline
  pair_strategy: random
  k_per_class: 8
  test_size: 0.2
  seeds: [0, 1, 2, 3, 4]
  pair_sampling:
    num_pos_per_anchor: 1
    num_neg_per_anchor: 1
  hard_negative:
    k_hard: 2
    k_easy: 1

evaluate:
  results_dir: results/research/amazon_counterfactual_en
  output_dir: results/research/amazon_counterfactual_en
  per_seed_plot_title: Per-seed Accuracy
  summary_bar_label: Model

demo:
  threshold: 0.1
  label_map:
    0: NON-COUNTERFACTUAL
    1: COUNTERFACTUAL
